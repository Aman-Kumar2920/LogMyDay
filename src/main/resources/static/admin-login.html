
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogMyDay | Admin Login</title>

    <script src="/admin-login.js" defer></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #101b35, #173c70);
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px 35px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            border-radius: 16px;
            background: #e9f1ff;
            color: #2457a6;
            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #172b4d;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 32px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #34445e;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 22px;
            border: 1px solid #dce3ed;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #3478d4;
            box-shadow: 0 0 0 3px rgba(52, 120, 212, 0.12);
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #2457a6;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #194681;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #8994a5;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">L</div>

    <h1>Admin Login</h1>

    <p class="subtitle">
        Log in to manage your LogMyDay system
    </p>

    <form id="adminLoginForm">

        <label for="adminId">Admin ID</label>
        <input
                type="text"
                id="adminId"
                name="adminId"
                placeholder="Enter Admin ID"
                autocomplete="username"
                required
        >

        <label for="adminPassword">Password</label>
        <input
                type="password"
                id="adminPassword"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
        >

        <button type="submit" id="loginButton">
            Secure Login
        </button>

    </form>

    <div class="footer">
        LogMyDay · Authorized Administrators Only
    </div>

</div>

</body>
</html>
